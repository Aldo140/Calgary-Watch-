name: Relabel Seeded Reports

# Manual only — this updates production documents.
# Run with dry_run: true first to see exactly what would change.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List matches without writing'
        type: boolean
        default: true

jobs:
  relabel:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Relabel seeded reports as examples
        run: npx tsx scripts/seed/relabel-demo.ts ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
