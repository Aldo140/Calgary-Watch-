name: Apply listing decisions (no email)
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: discovery-actions
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply queued listing decisions only
        id: apply
        run: npm run discovery:actions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}
      - name: Request publication when decisions changed listings
        if: ${{ steps.apply.outputs.applied != '' && steps.apply.outputs.applied != '0' }}
        run: gh workflow run deploy-firebase.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
