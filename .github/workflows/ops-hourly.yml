name: Operations Hourly

# scripts/ops/hourly.ts: publishes Instagram posts that were approved in /admin
# and are due, drafts briefs and redrafts the reviewer asked for, matches
# business replies (opt-outs are honoured immediately), and sends partner
# emails that were approved, only inside the weekday send window.
on:
  # Four times an hour, off the busy :00. GitHub drops or delays many scheduled runs
  # (on 2026-09-25 only ~4 of 24 hourly runs fired); every run catches up on what is
  # due, so more chances means posts go out close to their slot. Public repo: no cost.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      publish_now:
        description: 'Publish approved posts now instead of waiting for their time slot'
        type: boolean
        default: false

permissions:
  # Rendered post images are committed to the ops-media branch (see scripts/ops/lib/firebase.ts).
  contents: write
  # Keyless sign-in to arctos-hq for the HQ snapshot.
  id-token: write

# Two overlapping runs could publish the same post twice; never allow it.
concurrency:
  group: ops-hourly
  cancel-in-progress: false

jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Make sure ffmpeg is available (Reels)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      # HQ (arctoslaunchpad.com/hq): keyless sign-in to arctos-hq. GitHub's OIDC
      # token is exchanged for a short-lived Google token; no key is stored.
      - name: Sign in to arctos-hq
        id: hq
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/872261504062/locations/global/workloadIdentityPools/github/providers/arctos-repos
          service_account: firebase-adminsdk-fbsvc@arctos-hq.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      # The agents moved to ArctosLaunchpad (docs/OPS.md there). Once its first
      # run has started the handoff, this workflow does nothing. Anything but a
      # clear "not moved yet" stands down too, so the two can never both publish.
      - name: Stand down if the agents moved to Arctos
        id: moved
        env:
          TOKEN: ${{ steps.hq.outputs.access_token }}
        run: |
          code=000
          if [ -n "$TOKEN" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
              'https://firestore.googleapis.com/v1/projects/arctos-hq/databases/(default)/documents/ops_meta/handoff')
          fi
          if [ "$code" = 404 ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Ops moved to Arctos::The agents run from Aldo140/ArctosLaunchpad now (handoff check: HTTP $code)."
          fi
      # Approvals, rejections and replies made in HQ, applied before the run publishes and sends.
      - name: Apply HQ actions
        if: steps.moved.outputs.moved == 'false'
        continue-on-error: true
        run: npm run ops:hq-commands
        env:
          HQ_ACCESS_TOKEN: ${{ steps.hq.outputs.access_token }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}
      - name: Publish, draft briefs, sync replies, send approved email
        if: steps.moved.outputs.moved == 'false'
        run: npm run ops:hourly
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          IG_TOKEN_CALGARYWATCH: ${{ secrets.IG_TOKEN_CALGARYWATCH }}
          IG_TOKEN_CALGARYDAILY: ${{ secrets.IG_TOKEN_CALGARYDAILY }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OUTREACH_MAILBOX: ${{ vars.OUTREACH_MAILBOX }}
          DIGEST_MAILING_ADDRESS: ${{ vars.DIGEST_MAILING_ADDRESS }}
          OPS_PUBLISH_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_now && '1' || '' }}
          GITHUB_TOKEN: ${{ github.token }}

      # The HQ dashboard reads a summary of everything above.
      - name: Publish the HQ snapshot
        if: always() && steps.moved.outputs.moved == 'false'
        continue-on-error: true
        run: npm run ops:hq
        env:
          HQ_ACCESS_TOKEN: ${{ steps.hq.outputs.access_token }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}
