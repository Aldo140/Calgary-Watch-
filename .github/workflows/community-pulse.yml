name: Community Pulse

# Checks the randomized Calgary-time daily plan once an hour. The publisher
# emits only clearly badged example reports and atomically skips anything that
# has already been posted. The UTC ranges cover 07:00-22:00 in Calgary through
# both MST and MDT; the script itself owns the exact local-time guardrails.

on:
  schedule:
    - cron: '17 0-5,13-23 * * *'
  workflow_dispatch:

concurrency:
  group: community-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish example report
        run: npx tsx scripts/seed/activity.ts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
