name: Apply Discovery Moderation

# Applies admin event/market decisions queued in discovery_actions when the
# manageDiscovery Cloud Function isn't deployed (scripts/discovery/actions.ts),
# then republishes the site only if something changed. Cheap when idle: one
# query for pending actions. Also sends the queued vendor emails and the
# approval email for each newly approved listing claim.
on:
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:
    inputs:
      claim_email_sample:
        description: 'Only send a sample claim approval email to this address (nothing else runs)'
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: discovery-actions
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Send a sample claim approval email
        if: ${{ inputs.claim_email_sample }}
        run: npx tsx scripts/claims/send-approval-emails.ts
        env:
          CLAIM_EMAIL_SAMPLE_TO: ${{ inputs.claim_email_sample }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_MAILING_ADDRESS: ${{ vars.DIGEST_MAILING_ADDRESS }}
      - name: Apply queued moderation
        id: apply
        if: ${{ !inputs.claim_email_sample }}
        run: npm run discovery:actions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}
      # Vendor emails queued in Market HQ. Cheap when idle: one query.
      - name: Send queued vendor messages
        if: ${{ !inputs.claim_email_sample }}
        run: npx tsx scripts/markets/send-vendor-messages.ts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_MAILING_ADDRESS: ${{ vars.DIGEST_MAILING_ADDRESS }}
          DIGEST_FROM: ${{ vars.DIGEST_FROM }}
      # One email per newly approved listing claim (src/lib/claimApprovalEmail.ts).
      - name: Send claim approval emails
        if: ${{ !inputs.claim_email_sample }}
        run: npx tsx scripts/claims/send-approval-emails.ts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_MAILING_ADDRESS: ${{ vars.DIGEST_MAILING_ADDRESS }}
      # Tells admins about new claims and organizer sign-ups stuck before their claim (src/lib/claimAdminAlert.ts).
      - name: Email admins about new claims
        if: ${{ !inputs.claim_email_sample }}
        run: npx tsx scripts/claims/notify-admins.ts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_ALERT_TO: ${{ vars.ADMIN_ALERT_TO }}
      - name: Republish the site
        if: ${{ !inputs.claim_email_sample && steps.apply.outputs.applied != '' && steps.apply.outputs.applied != '0' }}
        run: gh workflow run deploy-firebase.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
