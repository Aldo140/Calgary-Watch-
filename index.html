    <script type="text/javascript">
  // Decode the path redirect produced by 404.html before React Router initialises.
  // 404.html encodes forward-slashes as '~and~', e.g. /map → /?p=~and~map
  (function(l) {
    // Exactly ?p=, not any query that happens to start with "p" (?page=2 used to be hijacked).
    if (l.search.slice(0, 3) === '?p=') {
      var rawPath = l.search.slice(3).split('&')[0]; // drop any &q=... query part
      var decoded = rawPath.replace(/~and~/g, '/');
      if (decoded.charAt(0) !== '/') decoded = '/' + decoded;
      window.history.replaceState(null, null, decoded + l.hash);
    }
  }(window.location));
</script>

    <!--
      First-paint styling for the prerendered shell.

      The build writes each route's real <h1> and description into #root so
      crawlers get content without executing JavaScript. React replaces it on
      mount (createRoot clears the container), but until then a visitor was
      looking at raw black-on-white text — which read as a broken page or a
      metadata dump rather than as Calgary Watch loading.

      This is inline and not in the CSS bundle on purpose: it has to apply on
      the very first paint, before any stylesheet has been fetched. The content
      itself is unchanged and still fully visible to crawlers, so this styles
      the page rather than hiding anything from anyone.
    -->
    <style>
      html, body { background: #06162F; margin: 0; }
      [data-prerendered-route] {
        min-height: 100dvh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 1rem; padding: 2rem 1.5rem; text-align: center;
        background: #06162F; color: #F2EFE8;
        font-family: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
      }
      [data-prerendered-route] h1 {
        margin: 0; max-width: 18ch;
        font-size: clamp(1.6rem, 5.5vw, 2.9rem);
        font-weight: 800; line-height: 1.05; letter-spacing: -0.03em;
      }
      [data-prerendered-route] p {
        margin: 0; max-width: 46ch;
        font-size: 0.95rem; line-height: 1.55; color: #AFC5DF;
      }
      [data-prerendered-route] a { color: #F2EFE8; }
      @media (prefers-reduced-motion: no-preference) {
        [data-prerendered-route] { animation: cw-shell-in 240ms ease-out both; }
        @keyframes cw-shell-in { from { opacity: 0 } to { opacity: 1 } }
      }
    </style>
    <!--
      Opening splash (#cw-splash, markup at the top of the body).

      Inline for the same reason as the shell styles above: it has to be on
      screen at first paint, before the CSS bundle or any font arrives. It
      covers the prerendered text while the app boots, then wipes away once
      the first route has rendered (window.__cwSplashDone, called from
      App.tsx). Everything is SVG and CSS so it costs no extra requests.
    -->
    <style>
      html.cw-splashing, html.cw-splashing body { overflow: hidden; }
      #cw-splash {
        --s-navy: #06162F; --s-cyan: #2EC4F1; --s-blue: #1554D1; --s-sun: #FFD23F;
        --s-coral: #FF6A4D; --s-cream: #FAF8F3; --s-muted: #8FA7C7;
        position: fixed; inset: 0; z-index: 2147483000;
        display: grid; place-items: center; overflow: hidden;
        color: var(--s-cream); background: var(--s-navy);
        font-family: "Bricolage Grotesque", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        clip-path: inset(0 0 0 0);
        transition: clip-path 760ms cubic-bezier(.76,0,.24,1);
      }
      /* Map-dot texture and two slow light pools: big Alberta sky, not a black box. */
      #cw-splash::before, #cw-splash::after { content: ""; position: absolute; pointer-events: none; }
      #cw-splash::before {
        inset: 0;
        background:
          radial-gradient(circle at 1px 1px, rgba(143,167,199,.16) 1px, transparent 1.4px) 0 0 / 22px 22px;
        -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
        mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
      }
      #cw-splash::after {
        inset: -30%;
        background:
          radial-gradient(closest-side at 30% 70%, rgba(46,196,241,.22), transparent),
          radial-gradient(closest-side at 72% 28%, rgba(255,106,77,.16), transparent),
          radial-gradient(closest-side at 55% 55%, rgba(255,210,63,.10), transparent 70%);
        animation: cws-drift 9s ease-in-out infinite alternate;
      }
      .cws-stage {
        position: relative; z-index: 2;
        display: flex; flex-direction: column; align-items: center; text-align: center;
        gap: clamp(14px, 2.4vh, 22px); padding: 0 16px;
        transform: translateY(-4vh);
        transition: transform 760ms cubic-bezier(.76,0,.24,1), opacity 500ms ease;
      }
      .cws-mark { width: clamp(132px, 36vw, 200px); height: auto; overflow: visible; filter: drop-shadow(0 18px 40px rgba(0,0,0,.45)); }
      .cws-word {
        margin: 0; display: flex; align-items: baseline; justify-content: center;
        font-size: clamp(38px, 11.5vw, 84px); line-height: .9; letter-spacing: -.055em;
        font-weight: 900; white-space: nowrap;
      }
      .cws-word span { display: inline-block; opacity: 0; transform: translateY(.55em) rotate(4deg); animation: cws-letter 620ms cubic-bezier(.2,.9,.25,1.15) both; }
      .cws-word .cws-light { font-weight: 500; }
      .cws-word .cws-dot { color: var(--s-cyan); }
      .cws-tag {
        margin: 0; display: flex; align-items: center; gap: .55em;
        font: 500 clamp(11px, 3.1vw, 13px)/1 "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: .14em; text-transform: uppercase; color: var(--s-muted);
        opacity: 0; animation: cws-fade 500ms 820ms ease both;
      }
      .cws-live { width: 8px; height: 8px; border-radius: 50%; background: var(--s-coral); box-shadow: 0 0 0 0 rgba(255,106,77,.6); animation: cws-ping 1.6s ease-out infinite; flex: none; }
      .cws-roll { position: relative; display: inline-block; vertical-align: middle; height: 1.25em; overflow: hidden; text-align: left; color: var(--s-cream); }
      .cws-roll i { display: block; height: 1.25em; line-height: 1.25em; font-style: normal; animation: cws-roll 4.8s 900ms cubic-bezier(.7,0,.2,1) infinite; }
      /* Corner furniture, desktop only. */
      .cws-corner {
        position: absolute; z-index: 2; margin: 0;
        font: 500 11px/1.5 "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: .14em; text-transform: uppercase; color: rgba(143,167,199,.75);
        opacity: 0; animation: cws-fade 600ms 500ms ease both;
      }
      .cws-tl { top: 28px; left: 32px; } .cws-tr { top: 28px; right: 32px; text-align: right; }
      .cws-corner b { color: var(--s-cream); font-weight: 600; }
      @media (max-width: 720px) { .cws-tr, .cws-sub { display: none; } .cws-tl { top: max(18px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; } }
      /* Skyline across the bottom: Saddledome, Calgary Tower, the Bow. */
      .cws-city { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; width: 100%; height: clamp(120px, 22vh, 210px); }
      .cws-city .cws-rockies { fill: none; stroke: rgba(143,167,199,.22); stroke-width: 1.5; stroke-dasharray: 2600; stroke-dashoffset: 2600; animation: cws-draw 1.8s 100ms ease-out forwards; }
      .cws-city .cws-towers { fill: rgba(4,14,33,.94); stroke: rgba(46,196,241,.55); stroke-width: 2; stroke-linejoin: round; stroke-dasharray: 3600; stroke-dashoffset: 3600; animation: cws-draw 1.6s ease-out forwards; }
      .cws-city circle { fill: var(--s-sun); opacity: 0; animation: cws-light 2.6s ease-in-out infinite; }
      .cws-bar { position: absolute; z-index: 3; left: 0; bottom: 0; height: 3px; width: 100%; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, var(--s-blue), var(--s-cyan) 60%, var(--s-sun)); animation: cws-load 2.8s cubic-bezier(.1,.7,.2,1) forwards; }
      /* The mark assembles itself: wave, sun, peaks, skyline, tower, sparkles. */
      .cws-mark * { transform-box: fill-box; }
      .cws-wave { fill: none; stroke-linecap: round; stroke-dasharray: 400; stroke-dashoffset: 400; animation: cws-draw 900ms cubic-bezier(.65,0,.25,1) forwards; }
      .cws-wave-hi { animation-delay: 120ms; }
      .cws-sun { transform-origin: 50% 50%; animation: cws-sun 800ms 180ms cubic-bezier(.2,.9,.3,1.2) both; }
      .cws-rays { transform-origin: 50% 100%; animation: cws-rays 500ms 650ms ease-out both; }
      .cws-peaks { transform-origin: 50% 100%; animation: cws-rise 600ms 260ms cubic-bezier(.2,.9,.3,1) both; }
      .cws-bld { transform-origin: 50% 100%; animation: cws-rise 520ms cubic-bezier(.2,.9,.3,1.1) both; }
      .cws-tower { transform-origin: 50% 100%; animation: cws-rise 700ms 620ms cubic-bezier(.2,.9,.3,1.15) both; }
      .cws-spark { transform-origin: 50% 50%; animation: cws-pop 520ms cubic-bezier(.2,1.4,.4,1) both, cws-twinkle 2.2s 1.2s ease-in-out infinite; }
      /* Leaving: the panel wipes up and the stage lifts with it. */
      #cw-splash.is-leaving { clip-path: inset(0 0 100% 0); pointer-events: none; }
      #cw-splash.is-leaving .cws-stage { transform: translateY(-14vh) scale(.94); opacity: 0; }
      #cw-splash.is-leaving .cws-bar { animation: none; transform: scaleX(1); transition: transform 240ms ease; }
      @keyframes cws-draw { to { stroke-dashoffset: 0; } }
      @keyframes cws-letter { to { opacity: 1; transform: none; } }
      @keyframes cws-fade { to { opacity: 1; } }
      @keyframes cws-sun { from { opacity: 0; transform: translateY(70%) scale(.6); } to { opacity: 1; transform: none; } }
      @keyframes cws-rays { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
      @keyframes cws-rise { from { opacity: 0; transform: scaleY(0); } to { opacity: 1; transform: none; } }
      @keyframes cws-pop { from { opacity: 0; transform: scale(0) rotate(-90deg); } to { opacity: 1; transform: none; } }
      @keyframes cws-twinkle { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(.72) rotate(18deg); } }
      @keyframes cws-ping { 0% { box-shadow: 0 0 0 0 rgba(255,106,77,.6); } 100% { box-shadow: 0 0 0 10px rgba(255,106,77,0); } }
      @keyframes cws-roll { 0%, 18% { transform: translateY(0); } 25%, 43% { transform: translateY(-100%); } 50%, 68% { transform: translateY(-200%); } 75%, 93% { transform: translateY(-300%); } 100% { transform: translateY(-400%); } }
      @keyframes cws-light { 0%, 100% { opacity: 0; } 30%, 70% { opacity: .9; } }
      @keyframes cws-load { 0% { transform: scaleX(0); } 100% { transform: scaleX(.86); } }
      @keyframes cws-drift { from { transform: translate3d(-3%, 2%, 0) rotate(0deg); } to { transform: translate3d(3%, -2%, 0) rotate(8deg); } }
      /* A reload in the same visit skips the build-up and goes straight to the finished mark. */
      #cw-splash.is-quick *, #cw-splash.is-quick::after { animation-duration: 1ms !important; animation-delay: 0s !important; }
      #cw-splash.is-quick .cws-roll i, #cw-splash.is-quick .cws-city circle, #cw-splash.is-quick .cws-live { animation: none !important; }
      #cw-splash.is-quick .cws-city circle { opacity: .7; }
      @media (prefers-reduced-motion: reduce) {
        #cw-splash *, #cw-splash::after { animation-duration: 1ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
        #cw-splash .cws-roll i { animation: none !important; }
        #cw-splash { transition: opacity 300ms ease; }
        #cw-splash.is-leaving { clip-path: inset(0 0 0 0); opacity: 0; }
        #cw-splash.is-leaving .cws-stage { transform: translateY(-4vh); }
      }
    </style>
    <noscript><style>#cw-splash { display: none !important; } html, body { overflow: auto !important; }</style></noscript>
  </head>

    <script>
      // Splash lifecycle. App.tsx calls window.__cwSplashDone() once the first
      // route has rendered; the timeout is a backstop so a failed boot still
      // reveals the prerendered page underneath.
      (function () {
        var el = document.getElementById('cw-splash');
        if (!el) return;
        var root = document.documentElement;
        var start = Date.now();
        var seen = false;
        try { seen = sessionStorage.getItem('cw-splash') === '1'; sessionStorage.setItem('cw-splash', '1'); } catch (e) {}
        if (seen) el.className = 'is-quick';
        root.classList.add('cw-splashing');
        // First visit plays the whole build-up; a reload in the same visit just bows out.
        var minShow = seen ? 200 : 1250;
        var clock = document.getElementById('cws-clock');
        try { clock.textContent = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Edmonton', hour: 'numeric', minute: '2-digit' }).format(new Date()); } catch (e) {}
        var done = false;
        window.__cwSplashDone = function () {
          if (done) return;
          done = true;
          setTimeout(function () {
            el.classList.add('is-leaving');
            root.classList.remove('cw-splashing');
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 900);
          }, Math.max(0, minShow - (Date.now() - start)));
        };
        setTimeout(window.__cwSplashDone, 10000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
