name: Operations Daily

# Morning run of the operations agent (scripts/ops/daily.ts): drafts Instagram
# posts for CalgaryWatch and CalgaryDaily from verified listings, flags posts
# whose listing changed, researches and drafts partner emails, checks health,
# and emails a summary. It never publishes or sends: that waits for approval
# in /admin and happens in Operations Hourly.
#
# 13:05 UTC = 07:05 MDT / 06:05 MST.
on:
  schedule:
    - cron: '5 13 * * *'
  workflow_dispatch:

permissions:
  # Rendered post images are committed to the ops-media branch (see scripts/ops/lib/firebase.ts).
  contents: write
  actions: read

concurrency:
  group: ops-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The same verified snapshot the live site is built from.
      - name: Build the discovery index
        run: npm run discovery:export
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}

      - name: Draft, research, check health, send summary
        run: npm run ops:daily
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          IG_TOKEN_CALGARYWATCH: ${{ secrets.IG_TOKEN_CALGARYWATCH }}
          IG_TOKEN_CALGARYDAILY: ${{ secrets.IG_TOKEN_CALGARYDAILY }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          OUTREACH_MAILBOX: ${{ vars.OUTREACH_MAILBOX }}
          # CASL: every outreach email carries a real mailing address.
          DIGEST_MAILING_ADDRESS: ${{ vars.DIGEST_MAILING_ADDRESS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_SUMMARY_TO: ${{ vars.OPS_SUMMARY_TO }}
          OPS_SUMMARY_FROM: ${{ vars.OPS_SUMMARY_FROM }}
          GITHUB_TOKEN: ${{ github.token }}
