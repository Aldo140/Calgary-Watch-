name: Purge Synthetic Incidents

# Manual only — this deletes production documents.
# Run with dry_run: true first to see exactly what would be removed.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List matches without deleting'
        type: boolean
        default: true

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Purge synthetic incidents
        run: npx tsx scripts/ingest/purge-synthetic.ts ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
