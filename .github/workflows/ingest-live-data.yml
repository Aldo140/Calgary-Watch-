name: Ingest Live Data

on:
  schedule:
    # Every 30 minutes — halves daily Firestore reads vs the prior 15-min schedule.
    - cron: '*/30 * * * *'
  # Allow a manual trigger from the Actions tab for testing.
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ingestion pipeline
        run: npx tsx scripts/ingest/index.ts
        env:
          # Store the full service-account JSON in this GitHub secret.
          # Generate it in Firebase Console → Project Settings → Service Accounts.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID:  ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          # Optional. Register through the official 511 Alberta developer portal.
          ALBERTA_511_API_KEY: ${{ secrets.ALBERTA_511_API_KEY }}
