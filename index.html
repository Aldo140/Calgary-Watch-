    <script type="text/javascript">
  // Decode the path redirect produced by 404.html before React Router initialises.
  // 404.html encodes forward-slashes as '~and~', e.g. /map → /?p=~and~map
  (function(l) {
    // Exactly ?p=, not any query that happens to start with "p" (?page=2 used to be hijacked).
    if (l.search.slice(0, 3) === '?p=') {
      var rawPath = l.search.slice(3).split('&')[0]; // drop any &q=... query part
      var decoded = rawPath.replace(/~and~/g, '/');
      if (decoded.charAt(0) !== '/') decoded = '/' + decoded;
      window.history.replaceState(null, null, decoded + l.hash);
    }
  }(window.location));
</script>

    <!--
      First-paint styling for the prerendered shell.

      The build writes each route's real <h1> and description into #root so
      crawlers get content without executing JavaScript. React replaces it on
      mount (createRoot clears the container), but until then a visitor was
      looking at raw black-on-white text — which read as a broken page or a
      metadata dump rather than as Calgary Watch loading.

      This is inline and not in the CSS bundle on purpose: it has to apply on
      the very first paint, before any stylesheet has been fetched. The content
      itself is unchanged and still fully visible to crawlers, so this styles
      the page rather than hiding anything from anyone.
    -->
    <style>
      html, body { background: #06162F; margin: 0; }
      [data-prerendered-route] {
        min-height: 100dvh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 1rem; padding: 2rem 1.5rem; text-align: center;
        background: #06162F; color: #F2EFE8;
        font-family: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
      }
      [data-prerendered-route] h1 {
        margin: 0; max-width: 18ch;
        font-size: clamp(1.6rem, 5.5vw, 2.9rem);
        font-weight: 800; line-height: 1.05; letter-spacing: -0.03em;
      }
      [data-prerendered-route] p {
        margin: 0; max-width: 46ch;
        font-size: 0.95rem; line-height: 1.55; color: #AFC5DF;
      }
      [data-prerendered-route] a { color: #F2EFE8; }
      @media (prefers-reduced-motion: no-preference) {
        [data-prerendered-route] { animation: cw-shell-in 240ms ease-out both; }
        @keyframes cw-shell-in { from { opacity: 0 } to { opacity: 1 } }
      }
    </style>
    <!--
      Opening splash (#cw-splash, markup at the top of the body).

      Inline for the same reason as the shell styles above: it has to be on
      screen at first paint, before the CSS bundle or any font arrives. It
      covers the prerendered text while the app boots, then leaves once the
      first route has rendered (window.__cwSplashDone, called from App.tsx).

      Every animation here moves only transform and opacity, on HTML-level
      layers, so the compositor runs them. That keeps them smooth while the
      main thread is busy parsing the app bundle, which is exactly when the
      splash is on screen. (SVG internals and stroke-dashoffset repaint on the
      main thread and stutter, so the mark is built from stacked SVG layers.)
    -->
    <style>
      html.cw-splashing, html.cw-splashing body { overflow: hidden; }
      #cw-splash {
        --s-navy: #06162F; --s-cyan: #2EC4F1; --s-blue: #1554D1; --s-sun: #FFD23F;
        --s-coral: #FF6A4D; --s-cream: #FAF8F3; --s-muted: #8FA7C7;
        --s-out: cubic-bezier(.16,1,.3,1);
        position: fixed; inset: 0; z-index: 2147483000;
        display: grid; place-items: center; overflow: hidden;
        color: var(--s-cream);
        font-family: "Bricolage Grotesque", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        will-change: transform;
        transition: transform 820ms cubic-bezier(.76,0,.24,1);
      }
      #cw-splash .cws-l, .cws-bg::after, .cws-word span, .cws-roll-in, .cws-city, .cws-bar, .cws-live::after { will-change: transform, opacity; }
      .cws-bg { position: absolute; inset: 0; background: var(--s-navy); transition: opacity 480ms ease 120ms; }
      .cws-bg::before, .cws-bg::after { content: ""; position: absolute; pointer-events: none; }
      /* Map-dot texture and slow light pools: big Alberta sky, not a black box. */
      .cws-bg::before {
        inset: 0;
        background: radial-gradient(circle at 1px 1px, rgba(143,167,199,.16) 1px, transparent 1.4px) 0 0 / 22px 22px;
        -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
        mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
      }
      .cws-bg::after {
        inset: -30%;
        background:
          radial-gradient(closest-side at 30% 70%, rgba(46,196,241,.22), transparent),
          radial-gradient(closest-side at 72% 28%, rgba(255,106,77,.16), transparent),
          radial-gradient(closest-side at 55% 55%, rgba(255,210,63,.10), transparent 70%);
        animation: cws-drift 10s ease-in-out infinite alternate;
      }
      .cws-stage {
        position: relative; z-index: 2;
        display: flex; flex-direction: column; align-items: center; text-align: center;
        gap: clamp(14px, 2.4vh, 22px); padding: 0 16px;
        transform: translateY(-4vh);
        transition: transform 820ms cubic-bezier(.76,0,.24,1), opacity 420ms ease;
      }
      /* The mark: stacked layers that assemble — disc, sun, skyline, then the C sweeps round. */
      .cws-mark { position: relative; width: clamp(156px, 46vw, 208px); aspect-ratio: 1; transition: transform 760ms cubic-bezier(.65,0,.15,1), opacity 220ms ease; }
      .cws-l { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
      .cws-disc { animation: cws-pop-in 620ms var(--s-out) backwards; }
      .cws-win { inset: 18%; width: auto; height: auto; border-radius: 50%; overflow: hidden; -webkit-mask-image: -webkit-radial-gradient(white, black); animation: cws-pop-in 620ms var(--s-out) backwards; }
      .cws-win svg { position: absolute; left: -28.125%; top: -28.125%; width: 156.25%; height: 156.25%; display: block; }
      .cws-sun { animation: cws-sunrise 1100ms 160ms var(--s-out) backwards; }
      .cws-peaks { animation: cws-rise 900ms 260ms var(--s-out) backwards; }
      .cws-scene { animation: cws-rise 900ms 380ms var(--s-out) backwards; }
      .cws-front { animation: cws-rise 900ms 480ms var(--s-out) backwards; }
      .cws-wave { transform-origin: 50% 50%; animation: cws-sweep 1100ms 60ms var(--s-out) backwards; filter: drop-shadow(0 16px 30px rgba(0,0,0,.4)); }
      .cws-spark { transform-origin: 50% 50%; animation: cws-spark 700ms var(--s-out) backwards, cws-twinkle 2.6s 1.4s ease-in-out infinite; }
      .cws-word {
        margin: 0; display: flex; align-items: baseline; justify-content: center;
        font-size: clamp(38px, 11.5vw, 84px); line-height: .9; letter-spacing: -.045em;
        font-weight: 900; white-space: nowrap; transition: opacity 260ms ease;
      }
      .cws-word span { display: inline-block; animation: cws-letter 900ms var(--s-out) backwards; }
      .cws-word .cws-light { font-weight: 500; }
      .cws-word .cws-dot { color: var(--s-cyan); }
      .cws-tag {
        margin: 0; display: flex; align-items: center; gap: .55em;
        font: 500 clamp(11px, 3.1vw, 13px)/1 "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: .14em; text-transform: uppercase; color: var(--s-muted);
        animation: cws-fade-up 700ms 760ms var(--s-out) backwards; transition: opacity 260ms ease;
      }
      .cws-live { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--s-coral); flex: none; }
      .cws-live::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--s-coral); animation: cws-ping 1.8s ease-out infinite; }
      .cws-roll { position: relative; display: inline-block; vertical-align: middle; height: 1.25em; overflow: hidden; text-align: left; color: var(--s-cream); }
      .cws-roll-in { display: block; animation: cws-roll 6s 1000ms cubic-bezier(.83,0,.17,1) infinite; }
      .cws-roll i { display: block; height: 1.25em; line-height: 1.25em; font-style: normal; }
      /* Corner furniture. */
      .cws-corner {
        position: absolute; z-index: 2; margin: 0;
        font: 500 11px/1.5 "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: .14em; text-transform: uppercase; color: rgba(143,167,199,.75);
        animation: cws-fade 800ms 400ms ease backwards; transition: opacity 260ms ease;
      }
      .cws-tl { top: 28px; left: 32px; } .cws-tr { top: 28px; right: 32px; text-align: right; }
      .cws-corner b { color: var(--s-cream); font-weight: 600; }
      @media (max-width: 720px) { .cws-tl, .cws-sub { display: none; } .cws-tr { top: max(20px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; } .cws-stage { transform: translateY(-2vh); } }
      /* Skyline across the bottom: Saddledome, Calgary Tower, the Bow, the river. */
      .cws-city { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; height: clamp(120px, 22vh, 210px); animation: cws-city 1400ms 120ms var(--s-out) backwards; transition: opacity 300ms ease; }
      .cws-city svg { width: 100%; height: 100%; display: block; }
      .cws-rockies { fill: none; stroke: rgba(143,167,199,.22); stroke-width: 1.5; }
      .cws-towers { fill: rgba(4,14,33,.94); stroke: rgba(46,196,241,.55); stroke-width: 2; stroke-linejoin: round; }
      .cws-river { fill: none; stroke: rgba(46,196,241,.35); stroke-width: 2; stroke-linecap: round; }
      .cws-city circle { fill: var(--s-sun); opacity: .85; }
      .cws-bar { position: absolute; z-index: 3; left: 0; bottom: 0; height: 3px; width: 100%; transform-origin: 0 50%; transform: scaleX(.86); background: linear-gradient(90deg, var(--s-blue), var(--s-cyan) 60%, var(--s-sun)); animation: cws-load 2.8s cubic-bezier(.1,.7,.2,1) backwards; transition: opacity 300ms ease; }
      /* Leaving: the whole sheet lifts away, its content easing out ahead of it. */
      #cw-splash.is-leaving { transform: translateY(-100%); pointer-events: none; }
      #cw-splash.is-leaving .cws-stage { transform: translateY(-10vh) scale(.96); opacity: 0; }
      /* Leaving for the homepage: the mark flies into the hero's logo while the rest fades. */
      #cw-splash.is-flying { pointer-events: none; }
      #cw-splash.is-flying .cws-bg, #cw-splash.is-flying .cws-corner, #cw-splash.is-flying .cws-word,
      #cw-splash.is-flying .cws-tag, #cw-splash.is-flying .cws-city, #cw-splash.is-flying .cws-bar { opacity: 0; }
      #cw-splash.is-flying .cws-wave { filter: none; }
      @keyframes cws-pop-in { from { opacity: 0; transform: scale(.55); } }
      @keyframes cws-sweep { from { opacity: 0; transform: rotate(-150deg) scale(.6); } }
      @keyframes cws-sunrise { from { opacity: 0; transform: translateY(26%) scale(.7); } }
      @keyframes cws-rise { from { opacity: 0; transform: translateY(34%); } }
      @keyframes cws-spark { from { opacity: 0; transform: scale(0) rotate(-120deg); } }
      @keyframes cws-twinkle { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(.75) rotate(20deg); } }
      @keyframes cws-letter { from { opacity: 0; transform: translateY(.6em); } }
      @keyframes cws-fade-up { from { opacity: 0; transform: translateY(8px); } }
      @keyframes cws-fade { from { opacity: 0; } }
      @keyframes cws-ping { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(2.8); } }
      @keyframes cws-roll { 0%, 17% { transform: translateY(0); } 25%, 42% { transform: translateY(-20%); } 50%, 67% { transform: translateY(-40%); } 75%, 92% { transform: translateY(-60%); } 100% { transform: translateY(-80%); } }
      @keyframes cws-city { from { opacity: 0; transform: translateY(40%); } }
      @keyframes cws-load { from { transform: scaleX(0); } }
      @keyframes cws-drift { from { transform: translate3d(-3%, 2%, 0) rotate(0deg); } to { transform: translate3d(3%, -2%, 0) rotate(8deg); } }
      /* A reload in the same visit skips the build-up and goes straight to the finished mark. */
      #cw-splash.is-quick *, #cw-splash.is-quick *::after { animation-duration: 1ms !important; animation-delay: 0s !important; }
      #cw-splash.is-quick .cws-roll-in, #cw-splash.is-quick .cws-spark, #cw-splash.is-quick .cws-live::after { animation: none !important; }
      @media (prefers-reduced-motion: reduce) {
        #cw-splash *, #cw-splash *::before, #cw-splash *::after { animation: none !important; }
        #cw-splash { transition: opacity 300ms ease; }
        #cw-splash.is-leaving { transform: none; opacity: 0; }
        #cw-splash.is-leaving .cws-stage { transform: translateY(-4vh); opacity: 1; }
      }
    </style>
    <noscript><style>#cw-splash { display: none !important; } html, body { overflow: auto !important; }</style></noscript>
  </head>

              <g fill="#0A1F44">

    <script>
      // Splash lifecycle. App.tsx calls window.__cwSplashDone() once the first
      // route has rendered; the timeout is a backstop so a failed boot still
      // reveals the prerendered page underneath.
      (function () {
        var el = document.getElementById('cw-splash');
        if (!el) return;
        var root = document.documentElement;
        var start = Date.now();
        var seen = false;
        try { seen = sessionStorage.getItem('cw-splash') === '1'; sessionStorage.setItem('cw-splash', '1'); } catch (e) {}
        if (seen) el.className = 'is-quick';
        root.classList.add('cw-splashing');
        // First visit plays the whole build-up; a reload in the same visit just bows out.
        var minShow = seen ? 200 : 1300;
        var clock = document.getElementById('cws-clock');
        try { clock.textContent = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Edmonton', weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(new Date()); } catch (e) {}
        var done = false;
        function remove(after) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, after); }
        // Two frames so the starting styles are committed before a transition begins.
        function nextFrame(fn) { requestAnimationFrame(function () { requestAnimationFrame(fn); }); }
        // On the homepage the mark lands on the hero's logo; elsewhere the sheet lifts away.
        function fly() {
          var mark = el.querySelector('.cws-mark');
          var target = document.querySelector('.h-hero-mark');
          if (!mark || !target || !target.offsetWidth || matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
          var t = target.getBoundingClientRect(), m = mark.getBoundingClientRect();
          if (t.bottom < 0 || t.top > innerHeight) return false;
          // The C fills ~88% of the splash mark and ~78% of the sticker; sizes come from
          // layout (offsetWidth), not the hero's own scale-in.
          var scale = (target.offsetWidth * 0.78) / (m.width * 0.885);
          var dx = t.left + t.width / 2 - (m.left + m.width / 2);
          var dy = t.top + t.height / 2 - (m.top + m.height / 2);
          target.style.animation = 'none';
          target.style.opacity = '0';
          root.classList.remove('cw-splashing');
          el.classList.add('is-flying');
          mark.style.transform = 'translate3d(' + dx + 'px,' + dy + 'px,0) scale(' + scale + ')';
          setTimeout(function () {
            target.style.transition = 'opacity 240ms ease';
            target.style.opacity = '1';
            mark.style.opacity = '0';
            remove(280);
          }, 760);
          return true;
        }
        window.__cwSplashDone = function () {
          if (done) return;
          done = true;
          setTimeout(function () {
            nextFrame(function () {
              if (fly()) return;
              el.classList.add('is-leaving');
              root.classList.remove('cw-splashing');
              remove(900);
            });
          }, Math.max(0, minShow - (Date.now() - start)));
        };
        setTimeout(window.__cwSplashDone, 10000);
      })();
    </script>
