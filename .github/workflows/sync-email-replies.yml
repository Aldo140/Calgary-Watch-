name: Sync Email Replies

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub scheduler drops.
    - cron: '7/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-email-replies
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Resend inbound mail
        run: npx tsx scripts/digest/sync-replies.ts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_INBOUND_ADDRESS: ${{ vars.DIGEST_INBOUND_ADDRESS }}
