name: Domain Availability

on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domain-availability
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify canonical site and DNS
        shell: bash
        run: |
          set -euo pipefail

          apex_code="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            --output /dev/null --write-out '%{http_code}' https://calgarywatch.ca/)"
          test "$apex_code" = "200"

          dns_answer="$(curl --fail --silent --show-error --retry 2 --max-time 20 \
            'https://dns.google/resolve?name=calgarywatch.ca&type=A')"
          echo "$dns_answer" | jq -e \
            '.Status == 0 and any(.Answer[]?; .data == "199.36.158.100")' >/dev/null

          echo "Canonical production site returned HTTP $apex_code and DNS points to Firebase Hosting."

      # These checks describe external configuration and reputation. They must
      # stay visible, but neither can be repaired by a source-code deployment,
      # so they are warnings rather than a permanently red application build.
      - name: Report alias and reputation advisories
        shell: bash
        run: |
          set -u

          www_code="$(curl --silent --show-error --retry 2 --max-time 20 \
            --output /dev/null --write-out '%{http_code}' https://www.calgarywatch.ca/ || echo unavailable)"
          if [ "$www_code" != "200" ]; then
            echo "::warning::www.calgarywatch.ca is not attached to the Firebase Hosting site (HTTP $www_code). The canonical https://calgarywatch.ca remains healthy."
          fi

          xfinity_payload="$(curl --silent --show-error --retry 2 --max-time 20 \
            'https://spa.xfinity.com/api/domain_status?domain=https%3A%2F%2Fcalgarywatch.ca%2F' || true)"
          xfinity_status="$(printf '%s' "$xfinity_payload" | jq -r '.block_status // "unavailable"' 2>/dev/null || echo unavailable)"
          if [ "$xfinity_status" != "not_blocked" ]; then
            echo "::warning::Xfinity Advanced Security reports calgarywatch.ca as: $xfinity_status. This requires an external reputation review, not a code change."
          fi

          {
            echo "### Domain availability"
            echo "- Canonical site: healthy"
            echo "- www alias: HTTP $www_code"
            echo "- Xfinity reputation: $xfinity_status"
          } >> "$GITHUB_STEP_SUMMARY"
