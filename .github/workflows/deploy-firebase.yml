name: Deploy Firebase Hosting

on:
  push:
    branches: ["main"]
  # The build pulls events and markets straight from organizer feeds, so a scheduled
  # rebuild keeps listings current even if the ingest job is down.
  schedule:
    - cron: '41 11,23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: "firebase"
  cancel-in-progress: true

jobs:
  # Every deploy costs ~2,000 Firestore reads (inventory export, organizer catalogue)
  # and adds a full release to Hosting storage, against free quotas of 50,000 reads
  # a day and 10 GB. This gate keeps the deploys that change something.
  gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      # Merges often land a few minutes apart. Waiting first lets the next push
      # cancel this run (cancel-in-progress above), so a burst ships once.
      - name: Let a burst of merges settle
        if: github.event_name == 'push'
        run: sleep 240
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          deploy=true
          # The scheduled rebuild is the fallback for when the event ingest (which
          # starts a deploy itself every 6 hours) is down. Skip it while a recent
          # deploy already carries fresh listings.
          if [ "${{ github.event_name }}" = schedule ]; then
            last="$(gh run list --workflow deploy-firebase.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt' || true)"
            if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt $(( 6 * 3600 )) ]; then
              deploy=false
              echo "::notice title=Rebuild skipped::The site was deployed at $last, under 6 hours ago."
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Export verified discovery inventory
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}
          # Ticketmaster concerts and games are read straight from the API at build time,
          # so they reach the site even when the ingest job can't write to Firestore.
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npm run discovery:export

      - name: Export the latest @calgarydaily posts (homepage strip)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}
        run: npm run ops:feed

      # Calgary crime and safety headlines for /safety and search, from newsroom
      # RSS feeds (no keys), merged with what the live site already published.
      - name: Export Calgary safety headlines
        continue-on-error: true
        run: npm run news:crime

      - name: Build Site
        env:
          VITE_BASE_PATH: /
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}
          # Web-push VAPID key. Absent = push stays dormant (UI hidden). Add the
          # secret in repo settings and the next deploy activates browser push.
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          DIGEST_SENDER_NAME: ${{ vars.DIGEST_SENDER_NAME }}
          DIGEST_MAILING_ADDRESS: ${{ vars.DIGEST_MAILING_ADDRESS }}
          DIGEST_SUPPORT_EMAIL: ${{ vars.DIGEST_SUPPORT_EMAIL }}
          DIGEST_ORIGIN: ${{ vars.DIGEST_ORIGIN }}
          VITE_DIGEST_ALLOWLIST: ${{ vars.DIGEST_ALLOWLIST }}
          VITE_DIGEST_LIMIT: ${{ vars.DIGEST_LIMIT }}
          VITE_DIGEST_PROOF_ENABLED: ${{ vars.DIGEST_PROOF_ENABLED }}
        run: npm run build

      # The ops agents (ArctosLaunchpad) draft posts and find leads from these
      # listings; they read this copy instead of needing this repository's code.
      - name: Publish the listings index for the ops agents
        run: cp src/generated/discovery-index.json dist/discovery-index.json

      # Firebase replaces the whole site on deploy. Carry the last week of
      # hashed page files forward so tabs opened before this deploy can still
      # open pages instead of hitting "Failed to fetch dynamically imported module".
      # The files come from this cache, not from calgarywatch.ca: downloading
      # them used most of Hosting's daily download quota.
      - name: Restore earlier builds' page files
        uses: actions/cache/restore@v4
        with:
          path: .hosting-assets
          key: hosting-assets-${{ github.run_id }}
          restore-keys: hosting-assets-

      - name: Keep earlier builds' page files for open tabs
        env:
          ASSET_CACHE_DIR: .hosting-assets
        run: node scripts/deploy/keep-previous-assets.mjs

      - name: Save page files for the next deploy
        uses: actions/cache/save@v4
        with:
          path: .hosting-assets
          key: hosting-assets-${{ github.run_id }}

      # The next deploy merges into this copy, so headlines outlive the feeds' short windows.
      - name: Publish the safety headlines
        run: cp src/generated/crime-news.json dist/crime-news.json

      # Publish the UI before backend provisioning. This keeps ordinary site
      # releases available even when a Google Cloud IAM or Secret Manager
      # change needs attention.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

      - name: Synchronize organization management catalogue
        run: npx tsx scripts/claims/sync-organization-catalog.ts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}

      # Verification belongs to the organizer: approved event or market claims
      # linked to a published organization profile get that profile's access.
      - name: Move event verifications to their organizers
        continue-on-error: true
        run: npx tsx scripts/claims/promote-organizer-claims.ts --apply
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}

      - name: Confirm published owner updates
        run: npx tsx scripts/claims/ack-owner-publication.ts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}

      - name: Record SEO deployment marker
        shell: bash
        run: |
          marker_commit="$(node -p "require('./dist/seo-release.json').commit")"
          marker_experiments="$(node -p "require('./dist/seo-release.json').activeExperiments.map((item) => item.id).join(', ') || 'none'")"
          {
            echo "## SEO deployment"
            echo "- Production commit: \`$marker_commit\`"
            echo "- Active experiments: $marker_experiments"
            echo "- Live marker: https://calgarywatch.ca/seo-release.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Bing and AI search indexes
        shell: bash
        run: |
          response_code="$(curl --silent --show-error --retry 2 --output /dev/null --write-out '%{http_code}' \
            --request POST 'https://api.indexnow.org/indexnow' \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data '{
              "host": "calgarywatch.ca",
              "key": "c37ca947ce2a9a5c7517be527c85bc79",
              "keyLocation": "https://calgarywatch.ca/c37ca947ce2a9a5c7517be527c85bc79.txt",
              "urlList": [
                "https://calgarywatch.ca/",
                "https://calgarywatch.ca/map",
                "https://calgarywatch.ca/community",
                "https://calgarywatch.ca/events",
                "https://calgarywatch.ca/markets",
                "https://calgarywatch.ca/guides",
                "https://calgarywatch.ca/neighbourhoods",
                "https://calgarywatch.ca/date-night",
                "https://calgarywatch.ca/about",
                "https://calgarywatch.ca/coverage",
                "https://calgarywatch.ca/calgary-neighbourhood-watch",
                "https://calgarywatch.ca/airdrie-crime-map",
                "https://calgarywatch.ca/safety",
                "https://calgarywatch.ca/llms.txt",
                "https://calgarywatch.ca/llms-full.txt"
              ]
            }' || echo unavailable)"
          if [[ ! "$response_code" =~ ^2 ]]; then
            echo "::warning::Hosting deployed, but IndexNow returned $response_code. Search discovery will retry naturally."
          fi
