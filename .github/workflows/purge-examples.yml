name: Purge Example Reports

# Manual only — deletes the seeded example reports from production.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Count without deleting'
        type: boolean
        default: true

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/seed/purge-examples.ts ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
