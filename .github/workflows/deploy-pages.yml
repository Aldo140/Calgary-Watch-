name: Publish www redirect (requires DNS)

# This artifact is ready for www.calgarywatch.ca, but the current DNS A record
# points to Firebase Hosting instead of GitHub Pages. Publishing on every source
# push cannot change that external routing, so this stays manual until DNS is
# changed to the GitHub Pages target. Domain Availability reports the mismatch.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www-redirect

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
