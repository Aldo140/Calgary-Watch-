name: Deploy Firebase Backend

# Backend releases are deliberately separate from ordinary Hosting releases.
# Rules-only releases are safe on the current Firebase plan. The `all` target
# additionally deploys Cloud Functions and therefore requires the paid service
# plus its IAM permissions; those limits never turn a healthy UI release red.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish the selected backend target'
        required: true
        type: string
      target:
        description: 'Rules can deploy without the paid Cloud Functions service'
        required: true
        default: rules
        type: choice
        options:
          - rules
          - functions
          - all

permissions:
  contents: read

concurrency:
  group: firebase-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install function dependencies
        if: ${{ inputs.target == 'all' || inputs.target == 'functions' }}
        run: npm ci --prefix functions

      - name: Authenticate Firebase CLI
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules
        if: ${{ inputs.target == 'rules' }}
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: node scripts/deploy-firestore-rules.mjs

      - name: Deploy Firestore and Storage rules
        if: ${{ inputs.target == 'all' }}
        run: npx firebase-tools deploy --only firestore:rules,storage --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Configure email provider secret
        if: ${{ inputs.target == 'all' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: printf '%s' "$RESEND_API_KEY" | npx firebase-tools functions:secrets:set RESEND_API_KEY --data-file - --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}"

      - name: Deploy backend functions
        if: ${{ inputs.target == 'all' || inputs.target == 'functions' }}
        run: npx firebase-tools deploy --only functions --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" --non-interactive
