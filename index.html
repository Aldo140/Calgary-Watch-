<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Security Headers are enforced via HTTP response headers on the server
      (see firebase.json headers config). Meta tag equivalents don't work for
      all headers, particularly X-Frame-Options.

      NOTE: Content-Security-Policy is intentionally not in meta tags
      because it cannot block inline event handlers or third-party Leaflet
      tile CDNs without breaking the map. Enforce CSP via server headers
      instead (see firebase.json headers config).
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Geo / Local SEO — helps Google local pack + Bing local -->
    <meta name="geo.region" content="CA-AB" />
    <meta name="geo.placename" content="Calgary, Alberta, Canada" />
    <meta name="geo.position" content="51.0447;-114.0719" />
    <meta name="ICBM" content="51.0447, -114.0719" />
    <meta http-equiv="content-language" content="en-CA" />
    <meta name="language" content="English" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:locale:alternate" content="en_US" />

    <title>Calgary Crime Watch &amp; Neighbourhood Safety Map</title>
    
    <!-- Icons — relative paths work with Vite `base` (e.g. GitHub project Pages /RepoName/) -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    
    <!-- PWA & Mobile Optimization -->
    <meta name="application-name" content="Calgary Watch" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Calgary Watch" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:image" content="https://calgarywatch.ca/images/hero-wide.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://calgarywatch.ca/images/hero-wide.webp" />
    
    <meta
      name="description"
      content="See live Calgary crime, traffic, weather and community incident reports on a free neighbourhood map. Browse without an account; sign in to report or get updates."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#020617" />
    <link rel="canonical" href="https://calgarywatch.ca/" />
    <link rel="alternate" hreflang="en-CA" href="https://calgarywatch.ca/" />
    <link rel="alternate" hreflang="x-default" href="https://calgarywatch.ca/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Calgary Watch" />
    <meta property="og:title" content="Calgary Crime Watch &amp; Neighbourhood Safety Map" />
    <meta
      property="og:description"
      content="See live Calgary crime, traffic, weather and community incident reports on a free neighbourhood map."
    />
    <meta property="og:url" content="https://calgarywatch.ca/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Calgary Crime Watch &amp; Neighbourhood Safety Map" />
    <meta
      name="twitter:description"
      content="See live Calgary crime and community incident reports near you. Free to browse and community-powered."
    />

    <!-- Structured Data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Calgary Watch",
      "url": "https://calgarywatch.ca/",
      "description": "Real-time community safety and crime map for Calgary and surrounding communities including Airdrie, Cochrane, Okotoks, Chestermere, Strathmore, and High River. Free, live, and community-powered.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "inLanguage": "en-CA",
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CAD" },
      "featureList": [
        "Real-time crime reporting",
        "Live incident map",
        "Neighbourhood safety intelligence",
        "Community-powered alerts",
        "Calgary area coverage"
      ],
      "screenshot": "https://calgarywatch.ca/images/hero-wide.webp",
      "author": {
        "@type": "Organization",
        "name": "Calgary Watch",
        "url": "https://calgarywatch.ca/"
      }
    }
    </script>

    <!-- Structured Data: WebSite — establishes the preferred site name -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Calgary Watch",
      "alternateName": "Calgary Crime Watch",
      "url": "https://calgarywatch.ca/",
      "description": "Free live crime and neighbourhood safety map for Calgary, Airdrie and surrounding Alberta communities.",
      "inLanguage": "en-CA"
    }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Calgary Watch",
      "url": "https://calgarywatch.ca/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://calgarywatch.ca/icon.webp",
        "width": 512,
        "height": 512
      },
      "image": "https://calgarywatch.ca/images/hero-wide.webp",
      "description": "Calgary Watch is a free community-powered real-time crime and safety platform serving Calgary, Airdrie, Cochrane, Okotoks, Chestermere, Strathmore, High River, Canmore, and all communities in the greater Calgary metropolitan area.",
      "areaServed": {
        "@type": "AdministrativeArea",
        "name": "Calgary Metropolitan Region",
        "addressRegion": "AB",
        "addressCountry": "CA",
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 51.0447,
          "longitude": -114.0719
        }
      },
      "knowsAbout": [
        "Crime reporting", "Community safety", "Incident mapping",
        "Neighbourhood watch", "Calgary crime statistics", "Real-time alerts",
        "Public safety Alberta", "Vehicle theft", "Property crime"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "availableLanguage": "English"
      }
    }
    </script>

    <script type="text/javascript">
  // Decode the path redirect produced by 404.html before React Router initialises.
  // 404.html encodes forward-slashes as '~and~', e.g. /map → /?p=~and~map
  (function(l) {
    if (l.search[1] === 'p') {
      var rawPath = l.search.slice(3).split('&')[0]; // drop any &q=... query part
      var decoded = rawPath.replace(/~and~/g, '/');
      if (decoded.charAt(0) !== '/') decoded = '/' + decoded;
      window.history.replaceState(null, null, decoded + l.hash);
    }
  }(window.location));
</script>

    <!--
      Preconnect to tile servers, image CDNs, and font providers.
      Using crossorigin on CORS-capable origins to allow credential-free
      connection reuse and reduce first-byte latency.
    -->
    <!-- Preload LCP hero image — direct Core Web Vitals / LCP improvement -->
    <link rel="preload" as="image" href="/images/hero-wide.webp" fetchpriority="high" type="image/webp" />

    <!-- Leaflet tile CDN -->
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin />
    <!-- Google Fonts — non-blocking load via media swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" /></noscript>
    <!-- Image CDNs (Pexels hero/card images, Unsplash panel image) -->
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <!-- Firebase Auth / Firestore -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
