name: Community Pulse

# Posts up to 3 community reports per day at realistic Calgary times.
# Each job passes a slot index (0=morning 7:30am, 1=afternoon 1pm, 2=evening 9:30pm MDT).
# The script skips gracefully if the slot was already posted.

on:
  schedule:
    # GitHub Actions uses UTC. MDT is UTC-6.
    - cron: '30 13 * * *'   # 07:30 MDT (slot 0 - morning)
    - cron: '0  19 * * *'   # 13:00 MDT (slot 1 - afternoon)
    - cron: '30  3 * * *'   # 21:30 MDT (slot 2 - evening, next UTC day)
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to run (0=morning, 1=afternoon, 2=evening)'
        required: false
        default: '0'

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The slot is derived inside the script from the current Calgary hour.
      # Matching exact UTC hours here was the bug: GitHub delays scheduled runs
      # by tens of minutes, so the hour never matched and every run skipped.
      - name: Publish example report
        run: npx tsx scripts/seed/activity.ts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}