name: Operations Daily

# Morning run of the operations agent (scripts/ops/daily.ts): drafts @calgarydaily
# posts from verified listings, flags posts whose listing changed, researches and
# drafts partner emails (queued automatically when autoSend is on), checks health
# and emails a summary. Publishing and sending happen in Operations Hourly.
on:
  schedule:
    # Several chances a day (03:05, 06:05, 07:05, 08:05 Calgary summer time) because GitHub
    # skips or delays scheduled runs. Every step is safe to repeat; the summary email goes
    # out once a day, from the first run after 6 am.
    - cron: '5 9,12,13,14 * * *'
  workflow_dispatch:

permissions:
  # Rendered post images are committed to the ops-media branch (see scripts/ops/lib/firebase.ts).
  contents: write
  # Keyless sign-in to arctos-hq for the HQ snapshot.
  id-token: write
  actions: read

concurrency:
  group: ops-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Make sure ffmpeg is available (Reels)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      # The same verified snapshot the live site is built from.
      - name: Build the discovery index
        run: npm run discovery:export
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}

      # HQ (arctoslaunchpad.com/hq): keyless sign-in to arctos-hq. GitHub's OIDC
      # token is exchanged for a short-lived Google token; no key is stored.
      - name: Sign in to arctos-hq
        id: hq
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/872261504062/locations/global/workloadIdentityPools/github/providers/arctos-repos
          service_account: firebase-adminsdk-fbsvc@arctos-hq.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      # Approvals, rejections and replies made in HQ, applied before the run publishes and sends.
      - name: Apply HQ actions
        continue-on-error: true
        run: npm run ops:hq-commands
        env:
          HQ_ACCESS_TOKEN: ${{ steps.hq.outputs.access_token }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}
      - name: Draft, research, check health, send summary
        run: npm run ops:daily
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          IG_TOKEN_CALGARYWATCH: ${{ secrets.IG_TOKEN_CALGARYWATCH }}
          IG_TOKEN_CALGARYDAILY: ${{ secrets.IG_TOKEN_CALGARYDAILY }}
          # The Scout reads other Calgary accounts (Business Discovery, Facebook-login Page token).
          IG_DISCOVERY_TOKEN: ${{ secrets.IG_DISCOVERY_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          OUTREACH_MAILBOX: ${{ vars.OUTREACH_MAILBOX }}
          # CASL: every outreach email carries a real mailing address.
          DIGEST_MAILING_ADDRESS: ${{ vars.DIGEST_MAILING_ADDRESS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_SUMMARY_TO: ${{ vars.OPS_SUMMARY_TO }}
          OPS_SUMMARY_FROM: ${{ vars.OPS_SUMMARY_FROM }}
          GITHUB_TOKEN: ${{ github.token }}

      # The HQ dashboard reads a summary of everything above.
      - name: Publish the HQ snapshot
        if: always()
        continue-on-error: true
        run: npm run ops:hq
        env:
          HQ_ACCESS_TOKEN: ${{ steps.hq.outputs.access_token }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}
